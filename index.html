<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NutriTrack MBG — Aplikasi Gabungan</title>
  <style>
    :root{
      --navy:#0e214d; --navy-2:#1e3a5f; --green:#10b981; --green-h:#059669;
      --bg:#f8fafc; --line:rgba(255,255,255,.14); --txt:#e8eef7; --muted:#9fb1cc;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);display:flex;flex-direction:column;height:100vh;overflow:hidden}

    /* ===== Header / Menu Gabungan ===== */
    .shell-header{background:linear-gradient(100deg,var(--navy),var(--navy-2));color:var(--txt);box-shadow:0 2px 14px rgba(14,33,77,.25);z-index:10}
    .shell-bar{display:flex;align-items:center;gap:20px;padding:0 22px;height:60px;max-width:1500px;margin:0 auto}
    .brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:19px;letter-spacing:-.3px;white-space:nowrap}
    .brand .dot{display:inline-flex;width:30px;height:30px;border-radius:9px;background:var(--green);align-items:center;justify-content:center;color:#06281d}
    .brand span{color:var(--green)}
    .shell-nav{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none}
    .shell-nav::-webkit-scrollbar{display:none}
    .nav-btn{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border:0;background:transparent;color:var(--muted);font-size:13.5px;font-weight:600;border-radius:9px;cursor:pointer;white-space:nowrap;transition:.18s;font-family:inherit}
    .nav-btn svg{width:17px;height:17px;flex:none}
    .nav-btn:hover{background:rgba(255,255,255,.07);color:#fff}
    .nav-btn.active{background:var(--green);color:#fff;box-shadow:0 4px 12px rgba(16,185,129,.35)}
    .owner-tag{font-size:10px;font-weight:700;padding:2px 6px;border-radius:20px;background:rgba(255,255,255,.12);color:#cfe0f5;margin-left:2px}
    .nav-btn.active .owner-tag{background:rgba(255,255,255,.25);color:#fff}

    /* ===== Konten ===== */
    .shell-main{flex:1;position:relative;background:var(--bg)}
    #content-frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
    .loader{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:14px;gap:10px;pointer-events:none;opacity:0;transition:.2s}
    .loader.show{opacity:1}
    .spin{width:18px;height:18px;border:2.5px solid #cbd5e1;border-top-color:var(--green);border-radius:50%;animation:sp .7s linear infinite}
    @keyframes sp{to{transform:rotate(360deg)}}

    @media(max-width:720px){
      .shell-bar{height:auto;flex-direction:column;align-items:stretch;padding:10px}
      .brand{justify-content:center;margin-bottom:4px}
      .owner-tag{display:none}
    }
  </style>
</head>
<body>
  <header class="shell-header">
    <div class="shell-bar">
      <div class="brand"><span class="dot">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
      </span>NutriTrack<span>MBG</span></div>

      <nav class="shell-nav" id="shellNav">
        <!-- 4 halaman versi TSABITA -->
        <button class="nav-btn" data-app="tsabita" data-page="dashboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
          Dashboard</button>
        <button class="nav-btn" data-app="tsabita" data-page="statistik">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 20V10M18 20V4M6 20v-4"/></svg>
          Statistik Gizi</button>
        <button class="nav-btn" data-app="tsabita" data-page="makanan">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5M3 12c0 1.66 4 3 9 3s9-1.34 9-3"/></svg>
          Data Makanan</button>
        <button class="nav-btn" data-app="tsabita" data-page="simulasi">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
          Simulasi Menu</button>

        <!-- 4 halaman versi IZZA -->
        <button class="nav-btn" data-app="izza" data-page="lokasi">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
          Lokasi SPPG</button>
        <button class="nav-btn" data-app="izza" data-page="laporan">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          Laporan</button>
        <button class="nav-btn" data-app="izza" data-page="edukasi">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M4 4.5A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5v-15z"/></svg>
          Edukasi</button>
        <button class="nav-btn" data-app="izza" data-page="pusatdata">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/><path d="M3 12c0 1.66 4 3 9 3s9-1.34 9-3"/></svg>
          Pusat Data</button>
      </nav>
    </div>
  </header>

  <main class="shell-main">
    <iframe id="content-frame" title="Konten NutriTrack MBG"></iframe>
    <div class="loader" id="loader"><span class="spin"></span> Memuat halaman…</div>
  </main>

  <script>
    const frame  = document.getElementById('content-frame');
    const loader = document.getElementById('loader');
    const nav    = document.getElementById('shellNav');
    const buttons = [...nav.querySelectorAll('.nav-btn')];

    let currentApp = null;     // aplikasi yang sedang termuat di iframe
    let safety = null;         // pengaman: paksa sembunyikan loader

    function hideLoader(){ loader.classList.remove('show'); if(safety){clearTimeout(safety); safety=null;} }
    function showLoader(){
      loader.classList.add('show');
      if(safety) clearTimeout(safety);
      safety = setTimeout(hideLoader, 4000); // paksa hilang maks 4 detik
    }

    function open(btn){
      buttons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const app  = btn.dataset.app;
      const page = btn.dataset.page;

      if (app === currentApp) {
        // Aplikasi sama -> cukup ganti hash, tidak perlu reload & tidak perlu spinner
        try {
          frame.contentWindow.location.hash = page;
        } catch (e) {
          frame.src = `apps/${app}/index.html#${page}`; // fallback aman
        }
        hideLoader();
      } else {
        // Pindah aplikasi -> muat ulang iframe
        currentApp = app;
        showLoader();
        frame.src = `apps/${app}/index.html#${page}`;
      }
    }

    buttons.forEach(b => b.addEventListener('click', () => open(b)));
    frame.addEventListener('load', hideLoader);

    // Halaman default: Dashboard (versi Tsabita)
    open(buttons[0]);
  </script>
</body>
</html>
